name: fetch odds

on:
  schedule:
    - cron: "15 5-22 * * *"   # every hour 06:15-23:15 Stockholm (winter); 2 requests per run, ~36 per day,
    # well under pinnapi's 80. The 05 UTC hour exists so the bookmaker step below lands before the morning scan.
    # :15 and not :35 because GitHub runs cron 10-15 minutes late and the scans start at 07:44, 11:44, 13:44,
    # 17:44 and 20:10 Stockholm: on 28 Nov the 07:35 fetch landed at 07:47, three minutes after the scan had
    # already cloned the repo, so the whole morning was priced on the previous evening's odds.
  workflow_dispatch:
    inputs:
      books:
        description: "fetch bookmaker prices even outside the three scheduled hours (costs 4 credits)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: |
          for i in 1 2 3; do python -m pip install -q pytest && break; sleep 5; done
          python -m pytest tests -q
      - name: odds
        env:
          PINNAPI_KEY: ${{ secrets.PINNAPI_KEY }}
        run: python fetch/run_odds.py
      # His own bookmakers' prices, so he stops checking them by hand (fetch/oddsapi.py). The free plan is 500
      # credits a MONTH and a request costs markets x regions whatever the number of events it returns, so a
      # whole league's 1X2 card costs one credit. The credits therefore buy LEAGUES, not markets: 1X2 alone is
      # worth 8.7% closing-line value against 6.5% for over/under 2.5 (research/where_is_the_edge.json), and a
      # league Jarvis has no price for is a league it cannot find a bet in at all - which is where the edge was
      # measured to be largest. fetch/oddsapi.py spends a day's allowance of 14 credits (420 a month, inside
      # the robot's own cap of 450), split 5/4/5 across the three hours with what an hour does not use rolling
      # forward, so it asks for about five leagues a run instead of the two it managed before.
      #
      # The five scans run at 07:44, 11:44, 13:44, 17:44 and 20:10 Stockholm = 06:44, 10:44, 12:44, 16:44 and
      # 19:10 UTC, and a book price older than BOOK_MAX_AGE_H (6 h) is ignored. Three fetches cover all five:
      #   05 UTC -> 06:44 (+1 h) and 10:44 (+5 h)
      #   11 UTC -> 12:44 (+1 h) and 16:44 (+5 h)
      #   18 UTC -> 19:10 (+1 h)
      # The old hours were 10, 16 and 19; 19:15 lands AFTER the 19:10 scan, so the evening scan - the one that
      # prices the late kick-offs - never saw a bookmaker price. Each fetch also keeps a 25-45 minute margin on
      # the scan after it, because GitHub runs cron 10-15 minutes late.
      # Without the ODDSAPI_KEY secret the script writes nothing and says so, and everything else carries on.
      - name: bookmaker prices (BetMGM, Svenska Spel)
        continue-on-error: true
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
        run: |
          H=$(date -u +%H)
          if [ "${{ inputs.books }}" = "true" ]; then H=force; fi
          case "$H" in
            05|11|18|force) python fetch/oddsapi.py --hours=10 ;;
            *) echo "not a bookmaker-price hour ($H UTC)" ;;
          esac
      - name: price every match (data/auto)
        continue-on-error: true
        run: python fetch/autoprice.py
      - name: commit
        run: |
          git config user.name "jarvis-data-bot"
          git config user.email "jarvis-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "odds $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
            sleep 5
          done
          exit 1
