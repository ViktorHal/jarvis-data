name: fetch odds

on:
  schedule:
    - cron: "15 6-22 * * *"   # every hour 07:15-23:15 Stockholm (winter); 2 requests per run, ~34 per day.
    # :15 and not :35 because GitHub runs cron 10-15 minutes late and the scans start at 07:44, 11:44, 13:44,
    # 17:44 and 20:10 Stockholm: on 28 Nov the 07:35 fetch landed at 07:47, three minutes after the scan had
    # already cloned the repo, so the whole morning was priced on the previous evening's odds.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: |
          for i in 1 2 3; do python -m pip install -q pytest && break; sleep 5; done
          python -m pytest tests -q
      - name: odds
        env:
          PINNAPI_KEY: ${{ secrets.PINNAPI_KEY }}
        run: python fetch/run_odds.py
      # His own bookmakers' prices, so he stops checking them by hand (fetch/oddsapi.py). The free plan is 500
      # credits a MONTH and one request costs markets x regions, so this runs three times a day, two leagues at
      # a time: 12 credits a day, about 370 a month, under the robot's own cap of 450. The hours are UTC and sit
      # about half an hour before the scans that make final calls (11:44, 17:44 and 20:10 Stockholm). Without the
      # ODDSAPI_KEY secret the script writes nothing and says so, and everything else carries on.
      - name: bookmaker prices (BetMGM, Svenska Spel)
        continue-on-error: true
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
        run: |
          H=$(date -u +%H)
          case "$H" in
            10|16|19) python fetch/oddsapi.py --max-keys=2 --markets=h2h,totals --hours=10 ;;
            *) echo "not a bookmaker-price hour ($H UTC)" ;;
          esac
      - name: price every match (data/auto)
        continue-on-error: true
        run: python fetch/autoprice.py
      - name: commit
        run: |
          git config user.name "jarvis-data-bot"
          git config user.email "jarvis-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "odds $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
            sleep 5
          done
          exit 1
