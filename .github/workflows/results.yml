name: fetch results

# Every hour: final results (FotMob football, NHL, SHL) into data/results/results.json, so Jarvis' bets are settled
# by code (jarvis/settle.py) instead of by web search.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: python -m unittest discover -s tests
      - name: results
        run: python fetch/results.py
      - name: commit
        run: |
          git config user.name "jarvis-data-bot"
          git config user.email "jarvis-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "results $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
            sleep 5
          done
          exit 1
