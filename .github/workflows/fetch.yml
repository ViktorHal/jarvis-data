name: fetch data

on:
  schedule:
    - cron: "20 4 * * *"    # 05:20 Stockholm (winter): before the 07:44 morning scan
    - cron: "20 10 * * *"   # 11:20 Stockholm: before the 11:44 midday scan
    - cron: "20 16 * * *"   # 17:20 Stockholm: before the 17:44 pre-match scan
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: fetch
        run: python fetch/run_all.py
      - name: commit
        run: |
          git config user.name "jarvis-data-bot"
          git config user.email "jarvis-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          # someone (a code change, another run) may have pushed meanwhile: rebase on it and retry
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
            sleep 5
          done
          exit 1
